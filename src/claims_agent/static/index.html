<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Health Claims Assistant</title>
<style>
  :root { --bg:#f5f7f6; --card:#fff; --text:#1b2420; --muted:#65716b; --line:#dfe5e2; --accent:#16705a; --tool:#eef4f1; --user:#e6f0ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121715; --card:#1b211e; --text:#e6ece9; --muted:#97a39d; --line:#2d3531; --accent:#5cc7a3; --tool:#202925; --user:#1f2e28; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 140px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .examples button { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; font-size:.82rem; cursor:pointer; text-align:left; }
  .msg { padding:12px 14px; border-radius:12px; margin:10px 0; white-space:pre-wrap; }
  .user { background:var(--user); margin-left:15%; }
  .bot { background:var(--card); border:1px solid var(--line); margin-right:8%; }
  .meta { color:var(--muted); font-size:.78rem; margin-top:6px; }
  details.tool { background:var(--tool); border-radius:8px; padding:6px 10px; margin:6px 8% 6px 0; font-size:.85rem; }
  details.tool summary { cursor:pointer; font-family: ui-monospace, Consolas, monospace; }
  details.tool pre { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font-size:.78rem; color:var(--muted); }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px; }
  .row { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:56px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; }
  button.send { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<main>
  <h1>Northwind Health Claims Assistant</h1>
  <p class="sub">An AI agent that looks up members, procedures, hospitals and claims through tools, and never does the money maths itself. Click a tool call to see what it returned.</p>
  <div class="examples" id="ex"></div>
  <div id="log"></div>
</main>
<form id="f">
  <div class="row">
    <textarea id="q" placeholder="Ask about a claim, a member's plan, or how much will be covered…" required></textarea>
    <button class="send" id="b">Send</button>
  </div>
</form>
<script>
const examples = [
  "What is the status of claim C9002?",
  "Member M1003 is getting an appendectomy at Sunrise Multispeciality Hospital on 2026-12-01. Bill Rs 1,50,000, room Rs 6,000/day. How much will insurance pay?",
  "Can member M1007 claim for a knee replacement at City Care Hospital on 10 December 2026? Bill Rs 3,00,000, room Rs 4,000 a day.",
  "How much will be covered for Rahul Verma's cataract surgery? His member ID is M1003."
];
const thread = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
const log = document.getElementById("log"), q = document.getElementById("q"), b = document.getElementById("b");
const ex = document.getElementById("ex");
examples.forEach(t => { const e = document.createElement("button"); e.type = "button"; e.textContent = t;
  e.onclick = () => { q.value = t; send(); }; ex.appendChild(e); });
document.getElementById("f").onsubmit = e => { e.preventDefault(); send(); };
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
function add(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.appendChild(d); d.scrollIntoView({block: "end"}); return d; }
function pretty(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } }
async function send() {
  const text = q.value.trim(); if (!text) return;
  q.value = ""; b.disabled = true; add("user", text);
  const wait = add("bot", "Thinking… (local models can take 30–60 seconds)");
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, thread_id: thread }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    wait.remove();
    data.tool_calls.forEach(c => {
      const d = document.createElement("details"); d.className = "tool";
      const s = document.createElement("summary"); s.textContent = `🔧 ${c.name}(${Object.values(c.args).join(", ")})`;
      const p = document.createElement("pre"); p.textContent = pretty(c.result);
      d.append(s, p); log.appendChild(d);
    });
    const m = add("bot", data.answer);
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = `${data.tool_calls.length} tool calls · ${data.llm_calls} LLM calls · ${(data.latency_ms / 1000).toFixed(1)} s`;
    m.appendChild(meta);
  } catch (e) { wait.textContent = "Error: " + e.message; }
  finally { b.disabled = false; q.focus(); }
}
</script>
</body>
</html>
